name: Tests

# Builds Foldera and runs its tests on a Mac, for every push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # These hand a file over through a file presenter (as Windows App does),
      # which needs a logged-in user's file coordination; hosted runners have
      # none, so they fail there even on code that passes on a Mac.
      NEEDS_A_DESKTOP: "aFileAnotherAppFillsInOnlyWhenReadArrivesWhole|aFolderWithSuchAFileInsideArrivesWhole|anAppALittleLateIsAskedAgain|aSlowHandOverIsSaid"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - name: Build
        run: swift build --build-tests
      - name: A second, case-sensitive volume
        # For the tests that move across drives and rename on a drive that tells case apart.
        run: |
          hdiutil create -size 512m -fs "Case-sensitive APFS" -volname FolderaTest "$RUNNER_TEMP/foldera-test.dmg"
          hdiutil attach "$RUNNER_TEMP/foldera-test.dmg"
          echo "FOLDERA_TEST_VOLUME=/Volumes/FolderaTest" >> "$GITHUB_ENV"
      - name: Test
        # A test that hangs shouldn't hold the run for half an hour: after ten
        # minutes the test process's threads are printed, and it is stopped.
        run: |
          ./test.sh --skip "$NEEDS_A_DESKTOP" > test.log 2>&1 &
          pid=$!
          for _ in $(seq 1 120); do
            sleep 5
            kill -0 "$pid" 2>/dev/null || break
          done
          if kill -0 "$pid" 2>/dev/null; then
            cat test.log
            echo "::error::The tests were still running after ten minutes."
            for p in $(pgrep -f "PackageTests|swiftpm-testing-helper|xctest"); do
              echo "===== $p: $(ps -o command= -p "$p")"
              sample "$p" 2 2>/dev/null | head -400
            done
            kill "$pid"
            exit 1
          fi
          wait "$pid" && status=0 || status=$?
          cat test.log
          exit "$status"
