name: Tests

# Builds Foldera and runs its tests on a Mac, for every push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    env:
      # These require another app to supply promised file bytes through a
      # file presenter (as Windows App does). Hosted runners don't provide
      # that interactive handoff, though ordinary AppKit windows work there.
      NEEDS_A_DESKTOP: "aFileAnotherAppFillsInOnlyWhenReadArrivesWhole|aFolderWithSuchAFileInsideArrivesWhole|anAppALittleLateIsAskedAgain|aSlowHandOverIsSaid"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
      - name: A disposable disk for failure tests
        id: fault_disk
        run: |
          mkdir -p "$RUNNER_TEMP/foldera-fault/mounted"
          hdiutil create -size 512m -fs APFS -volname FolderaFaultTest "$RUNNER_TEMP/foldera-fault/disposable.dmg"
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/foldera-fault/mounted" "$RUNNER_TEMP/foldera-fault/disposable.dmg"
          echo "$RUNNER_TEMP/foldera-fault/disposable.dmg" > "$RUNNER_TEMP/foldera-fault/mounted/.foldera-disposable"
          echo "FOLDERA_DISK_FAILURE_VOLUME=$RUNNER_TEMP/foldera-fault/mounted" >> "$GITHUB_ENV"
      - name: Build
        id: build
        run: swift build -c "${{ matrix.configuration }}" --build-tests -Xswiftc -enable-testing
      - name: An exFAT volume for native hidden attributes
        run: |
          hdiutil create -size 128m -layout NONE -type UDRW "$RUNNER_TEMP/foldera-exfat.dmg"
          device=$(hdiutil attach -nomount "$RUNNER_TEMP/foldera-exfat.dmg" | awk '/^\/dev\/disk/ {print $1; exit}')
          test -n "$device"
          sudo newfs_exfat -v FolderaExFAT "$device"
          diskutil mount "$device"
          echo "FOLDERA_EXFAT_VOLUME=/Volumes/FolderaExFAT" >> "$GITHUB_ENV"
      - name: A second, case-sensitive volume
        # For the tests that move across drives and rename on a drive that tells case apart.
        run: |
          hdiutil create -size 512m -fs "Case-sensitive APFS" -volname FolderaTest "$RUNNER_TEMP/foldera-test.dmg"
          hdiutil attach "$RUNNER_TEMP/foldera-test.dmg"
          echo "FOLDERA_TEST_VOLUME=/Volumes/FolderaTest" >> "$GITHUB_ENV"
      - name: Test
        # A test that hangs shouldn't hold the run for half an hour: after ten
        # minutes the test process's threads are printed, and it is stopped.
        run: |
          ./test.sh -c "${{ matrix.configuration }}" --skip "$NEEDS_A_DESKTOP" > test.log 2>&1 &
          pid=$!
          for _ in $(seq 1 120); do
            sleep 5
            kill -0 "$pid" 2>/dev/null || break
          done
          if kill -0 "$pid" 2>/dev/null; then
            cat test.log
            echo "::error::The tests were still running after ten minutes."
            for p in $(pgrep -f "PackageTests|swiftpm-testing-helper|xctest"); do
              echo "===== $p: $(ps -o command= -p "$p")"
              sample "$p" 2 2>/dev/null | head -400
            done
            kill "$pid"
            exit 1
          fi
          wait "$pid" && status=0 || status=$?
          cat test.log
          if [ "$status" -eq 0 ] && ! grep -Eq 'Test run with [0-9]+ tests? .*passed' test.log; then
            echo "::error::The test process exited without a completed Swift Testing run."
            exit 1
          fi
          exit "$status"
      - name: Package and verify the release application
        if: ${{ matrix.configuration == 'release' }}
        run: |
          ./build.sh
          codesign --verify --deep --strict build/Foldera.app
      - name: Preview window snapshots
        id: previews
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/preview-fixture" "$RUNNER_TEMP/preview-snapshots"
          cat > "$RUNNER_TEMP/preview-fixture/Reading.md" <<'MARKDOWN'
          # A little more room to read

          The Details pane can open in its own window. Markdown stays rendered,
          with **bold text**, *emphasis*, and `inline code`.

          ## Working with the preview

          - Detach the panel using the button in its header.
          - Use the full-screen button for a larger view.
          - Dock it again without losing your place or your draft.

          | View | Content |
          | --- | --- |
          | Details pane | Preview alongside the file list |
          | Separate window | More room for reading |

          > Editing remains available when you need it.
          MARKDOWN
          .build/${{ matrix.configuration }}/Foldera --snapshot "$RUNNER_TEMP/preview-fixture" "$RUNNER_TEMP/preview-snapshots/attached.png" --pane --select Reading.md --light --wait 6
          .build/${{ matrix.configuration }}/Foldera --snapshot "$RUNNER_TEMP/preview-fixture" "$RUNNER_TEMP/preview-snapshots/detached-light.png" --pane --select Reading.md --act detachpreview --light --wait 6
          .build/${{ matrix.configuration }}/Foldera --snapshot "$RUNNER_TEMP/preview-fixture" "$RUNNER_TEMP/preview-snapshots/detached-dark.png" --pane --select Reading.md --act detachpreview --dark --wait 6
      - name: Native preview full-screen round trip
        if: ${{ !cancelled() && steps.previews.outcome == 'success' }}
        timeout-minutes: 1
        run: .build/${{ matrix.configuration }}/Foldera --snapshot "$RUNNER_TEMP/preview-fixture" "$RUNNER_TEMP/preview-snapshots/fullscreen.png" --pane --select Reading.md --light --verify-preview
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.previews.outcome == 'success' }}
        with:
          name: preview-snapshots-${{ matrix.configuration }}
          path: ${{ runner.temp }}/preview-snapshots/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Detach the disposable failure-test disk
        if: ${{ always() && steps.fault_disk.outcome == 'success' }}
        run: hdiutil detach "$FOLDERA_DISK_FAILURE_VOLUME"
